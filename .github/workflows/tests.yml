name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install requirements
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install requirements
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  library:
    # The oldest modbus-connection a supported Home Assistant ships, and the newest.
    name: Device library on modbus-connection ${{ matrix.modbus-connection }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modbus-connection: ["==4.12.3", ""]
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Pytest
        # Only the library tests: they need no Home Assistant, so the project's
        # pinned environment is left out.
        run: >
          uv run --no-project --python 3.14
          --with "modbus-connection[tmodbus]${{ matrix.modbus-connection }}"
          --with pytest --with pytest-asyncio
          pytest tests/lib -p no:cacheprovider
