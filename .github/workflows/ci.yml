name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, to catch new hassfest and HACS checks between changes.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    # Which checks the change needs. Jobs skip rather than the workflow, so
    # "CI passed" reports on every pull request. Scheduled and manual runs
    # run everything.
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # a pull request's files come from the API
    outputs:
      lint: ${{ steps.filter.outputs.lint || 'true' }}
      tests: ${{ steps.filter.outputs.tests || 'true' }}
      library: ${{ steps.filter.outputs.library || 'true' }}
      integration: ${{ steps.filter.outputs.integration || 'true' }}
    steps:
      - name: Check out the repository
        # A push is compared with the commit before it, using git.
        if: github.event_name == 'push'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Find the checks the changed files need
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            dependencies: &dependencies
              - pyproject.toml
              - uv.lock
            lint:
              - *workflow
              - *dependencies
              - "**/*.py"
              - custom_components/cfos_powerbrain/strings.json
              - custom_components/cfos_powerbrain/translations/**
            tests:
              - *workflow
              - *dependencies
              - custom_components/**
              - tests/**
              - script/check_coverage.py
            library:
              - *workflow
              - pyproject.toml
              - custom_components/cfos_powerbrain/cfos_modbus/**
              - tests/lib/**
              - tests/registers.py
            integration:
              - *workflow
              - *dependencies
              - custom_components/**
              - hacs.json
              - script/check_quality_scale.py
              - script/check_version.py

  lint:
    name: Lint and type-check
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install requirements
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Translations
        # Home Assistant loads translations/en.json; strings.json is its source.
        run: >
          cmp custom_components/cfos_powerbrain/strings.json
          custom_components/cfos_powerbrain/translations/en.json

      - name: Mypy
        # Strict, plus the checks Home Assistant core adds (Platinum strict-typing).
        run: uv run mypy

  test:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install requirements
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=json

      - name: Coverage per module
        # Silver test-coverage and Bronze config-flow-test-coverage.
        run: uv run python script/check_coverage.py

  library:
    # The oldest modbus-connection a supported Home Assistant ships, and the newest.
    name: Device library on modbus-connection ${{ matrix.modbus-connection }}
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modbus-connection: ["==4.12.3", ""]
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Pytest
        # Only the library tests: they need no Home Assistant, so the project's
        # pinned environment is left out.
        run: >
          uv run --no-project --python 3.14
          --with "modbus-connection[tmodbus]${{ matrix.modbus-connection }}"
          --with pytest --with pytest-asyncio
          pytest tests/lib -p no:cacheprovider

  quality-scale:
    name: Quality scale
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install requirements
        run: uv sync --locked

      - name: Find the Home Assistant version the tests pin
        id: homeassistant
        run: >
          echo "version=$(uv run python -c
          'from homeassistant.const import __version__; print(__version__)')"
          >> "$GITHUB_OUTPUT"

      - name: Check out hassfest of that version
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: home-assistant/core
          ref: ${{ steps.homeassistant.outputs.version }}
          path: home-assistant-core
          sparse-checkout: script/hassfest
          persist-credentials: false

      - name: Check the quality scale
        # Bronze, Silver and strict-typing; hassfest skips this for custom
        # integrations.
        run: uv run python script/check_quality_scale.py home-assistant-core

  version:
    name: Version
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the release tags and the changes since the latest
          persist-credentials: false

      - name: Check the version against the releases
        # A changed integration needs a version above the latest release.
        run: python3 script/check_version.py

  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  hacs: # https://github.com/hacs/action
    name: HACS
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  passed:
    # The one check branch protection needs to require. A skipped job had
    # nothing to check, as none of its files changed.
    name: CI passed
    if: always()
    needs: [changes, lint, test, library, quality-scale, version, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
