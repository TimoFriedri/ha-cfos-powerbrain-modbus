# Integration Quality Scale: reviewed against the Bronze and Silver tiers,
# and Platinum's strict-typing rule. The other rules of higher tiers are not
# reviewed yet and stay `todo`.
rules:
  # Bronze
  action-setup:
    status: done
    comment: set_charging_manager_variable is registered in async_setup; it validates the entry and the variable name and raises ServiceValidationError.
  appropriate-polling:
    status: done
    comment: Live values every 10 s by default (1-30 s option), well inside the wallbox's 300 s Modbus fail-safe; settings every 5 minutes.
  brands:
    status: done
    comment: Local brand images in brand/ (Home Assistant 2026.3+).
  common-modules:
    status: done
    comment: coordinator.py and entity.py; the device library is the vendored cfos_modbus package.
  config-flow:
    status: done
    comment: The charging point's connection is data, changed by reconfigure. The polling interval, the S0 meters and the Charging Manager (with its port and Modbus ID) are options; setup asks for the interval and the Charging Manager and stores them as options. Every field has a data_description.
  config-flow-test-coverage:
    status: done
    comment: 100 % of config_flow.py, including reconfigure, options and the Charging Manager probe in both; every error is followed by a successful retry.
  dependency-transparency:
    status: exempt
    comment: No requirements of its own. modbus-connection comes with the modbus integration; the device library is vendored in this repository.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing but their coordinator, through CoordinatorEntity.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: The charging point's first refresh raises ConfigEntryNotReady, or ConfigEntryError for a device that is not a cFos one. The optional S0 meters and Charging Manager continue setup and come up once they answer.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: The action raises ServiceValidationError for a wrong call and HomeAssistantError when its write fails; entity writes raise HomeAssistantError.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads the platforms, listeners are tied to the entry, and the modbus integration closes the shared connections.
  docs-configuration-parameters:
    status: done
    comment: README "Configuration" lists every option.
  docs-installation-parameters:
    status: done
    comment: README "Configuration" describes every setup field.
  entity-unavailable:
    status: done
    comment: Entities are unavailable while their coordinator fails or their register block does not answer, the energy totals included.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The coordinators log a failed poll and its recovery once each; a single register block that stops answering is logged once at info, as is its return.
  parallel-updates:
    status: done
    comment: Read-only platforms use 0, as the coordinators poll; writing platforms use 1, so writes to the device never overlap.
  reauthentication-flow:
    status: exempt
    comment: Modbus TCP has no credentials.
  test-coverage:
    status: done
    comment: Every module, the device library included, is above 95 %.

  # Gold
  devices: todo
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing:
    status: done
    comment: mypy strict plus the checks Home Assistant core adds (pyproject.toml); the typed CfosConfigEntry is used throughout; modbus-connection and tmodbus ship py.typed.
