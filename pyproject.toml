# Development tooling only. The integration ships through HACS from
# custom_components/cfos_powerbrain; this project is never built or installed.

[project]
name = "ha-cfos-powerbrain-modbus"
version = "0"  # never released; the integration's version is in manifest.json
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    # Pins Home Assistant 2026.10.2 and its test harness.
    "pytest-homeassistant-custom-component==0.13.373",
    # What Home Assistant 2026.10.2's modbus integration installs at runtime.
    "modbus-connection[tmodbus]==4.12.4",
    "pymodbus==3.13.1",
    "tmodbus==0.6.2",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[tool.uv]
package = false
# Home Assistant 2026.10 pins Pillow 12.3.0, which has known vulnerabilities.
# Only the test harness brings it in; nothing here uses it.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/cfos_powerbrain"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "SIM", "RUF"]
ignore = [
    "D107", # the class docstring covers __init__
    "D401", # docstrings name things as often as they command
    "E501", # the formatter owns line length
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["cfos_modbus", "custom_components", "tests"]
combine-as-imports = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "homeassistant",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/cfos_powerbrain"]
strict = true
# What Home Assistant core checks on top for its strictly typed integrations.
warn_unreachable = true
strict_bytes = true
local_partial_types = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
# Home Assistant re-exports names from component packages without __all__.
module = ["homeassistant.*"]
implicit_reexport = true
